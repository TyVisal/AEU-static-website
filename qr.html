  <body>
    <nav
      id="navv"
      class="bg-gray-600 text-white flex justify-between items-center w-[100%] h-[8vh] fixed top-0 left-0 z-50"

      <div class="flex justify-center items-center gap-[1rem] ml-[15%]">

        <p class="font-prosto text-[12px]">AEU Mobile</p>
      </div>
      <div id="mainul">
        <ul id="showl" class="flex gap-[1rem] font-battambang">
          <li data-lang="km" class="lang-flag">
            <img
              id="navimgone"
              class="w-[35px]"
              src="src/assets/navbar-img/cambodia.png"
              alt=""
            />
          </li>
          <li data-lang="en" class="lang-flag">
            <img
              id="navimgtwo"
              class="w-[35px]"
              src="src/assets/navbar-img/english.png"
              alt=""
            />
          </li>
          <li data-lang="zh" class="lang-flag">
            <img
              id="navimgthree"
              class="w-[35px]"
              src="src/assets/navbar-img/china.png"
              alt=""
            />
          </li>

          <li>
            <a href="navlink/invite.html" data-i18n="invite">ការអញ្ចើញ</a>
          </li>
          <li>
            <a href="navlink/curriculum.html" data-i18n="lettion">មុខវិជ្ចា</a>
          </li>
          <li>
            <a href="navlink/course.html" data-i18n="turn">វគ្គសិសក្សា</a>
          </li>
          <li><a href="navlink/exam.html" data-i18n="exam">ប្រលង</a></li>
          <li>
            <a href="navlink/profile.html" data-i18n="profile">ប្រវត្តិរូប</a>
          </li>
          <li><a href="./navlink/logout.html" data-i18n="logout">ចេកចាញ</a></li>
          <li>
            <i
              class="fa-solid fa-question"
              style="color: rgb(255, 255, 255)"
            ></i>
          </li>
        </ul>
      </div>
      <button id="btnl">
        <i class="bi bi-list text-[30px]"></i>
      </button>
    </nav>

    <div id="qrsctop" class="tabs mt-[100px]">
      <div class="tab-btn active" data-tab="location">Location</div>
      <div class="tab-btn" data-tab="camera">Camera</div>
      <div class="tab-btn" data-tab="qr">QR</div>
    </div>

    <!-- Tab 1: Location -->
    <div class="tab-content active" id="location">
      <p id="status">Requesting location permission...</p>

      <div id="resultBox" style="display: none">
        <div class="info-box">
          <div class="info-row"><span>Lat</span><span id="lat">—</span></div>
          <div class="info-row"><span>Lng</span><span id="lng">—</span></div>
        </div>
        <button id="viewMapBtn">View on Google Maps</button>
      </div>
    </div>

    <!-- Tab 2: Camera -->
    <div class="tab-content" id="camera">
      <p id="camStatus">Requesting camera permission...</p>
      <video id="video" autoplay playsinline style="display: none"></video>
    </div>

    <!-- Tab 3: Simple text -->
    <div class="tab-content" id="qr">
      <p>Please scan the QR Code to share with your friend.</p>
      <p>You have scanned: 0 times.</p>
    </div>

    >
